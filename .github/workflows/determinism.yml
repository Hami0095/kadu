name: determinism

on:
  push:
  pull_request:

jobs:
  determinism-matrix:
    name: determinism (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-latest
            label: macos-arm64
          - os: windows-latest
            label: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test --workspace
        run: cargo test --workspace --locked

      - name: no-float check (kadu-core must contain no f32/f64)
        run: cargo test -p kadu-core no_float_lint -- --nocapture

      - name: cargo build --release
        run: cargo build --release -p kadu-cli --locked

      - name: kadu bench --matches 10000 --seed 1 (checked against determinism/expected.toml)
        shell: bash
        run: |
          BIN=./target/release/kadu
          if [ -f "${BIN}.exe" ]; then BIN="${BIN}.exe"; fi
          "$BIN" bench --matches 10000 --seed 1 --expect determinism/expected.toml

  replay-corpus:
    name: replay corpus (kadu verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build --release
        run: cargo build --release -p kadu-cli --locked

      - name: kadu verify every replay in tests/corpus
        run: |
          status=0
          for f in tests/corpus/*.json; do
            echo "--- $f ---"
            ./target/release/kadu verify "$f" || status=1
          done
          exit $status
