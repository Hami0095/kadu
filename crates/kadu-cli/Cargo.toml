[package]
name = "kadu-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kadu"
path = "src/main.rs"

[dependencies]
kadu-core = { path = "../kadu-core" }
kadu-agent = { path = "../kadu-agent" }
kadu-replay = { path = "../kadu-replay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
trace-hashes = ["kadu-core/trace-hashes", "kadu-replay/trace-hashes"]
